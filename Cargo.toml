[package]
name = "chat-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chatd"
path = "src/bin/chatd.rs"

[[bin]]
name = "tg-chat"
path = "src/bin/tg-chat.rs"

[[bin]]
name = "botwatch"
path = "src/bin/botwatch.rs"

[[bin]]
name = "dbbench"
path = "src/bin/dbbench.rs"

[lib]
name = "chat_bot"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
libc = "0.2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
